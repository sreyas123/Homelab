# (Replace every <TAILSCALE_IP> below with your own Tailscale IP address - or your server's home IP if you don't use Tailscale)
# (Replace every 192.168.0.113 below with your own server's home-network IP address - it is only an example)

- Live:
    - Server:
        description: Live health of the whole server
        href: http://192.168.0.113:3002
        icon: mdi-server-network
        statusStyle: dot
        server: local
        container: status-dashboard
        widget:
          type: customapi
          url: http://192.168.0.113:3002/api/summary
          refreshInterval: 10000
          mappings:
            - field: status
              label: Status
            - field: containers
              label: Services
            - field: io
              label: Drive busy
              suffix: "%"
            - field: temp
              label: Temp
              suffix: " C"

- Media:
    - Jellyfin:
        description: Media library
        href: http://<TAILSCALE_IP>:8096
        icon: jellyfin.png
        siteMonitor: http://192.168.0.113:8096
        statusStyle: dot
        server: local
        container: jellyfin
        widget:
          type: customapi
          url: http://192.168.0.113:3002/api/service/jellyfin
          refreshInterval: 15000
          mappings:
            - field: cpu
              label: CPU
              suffix: "%"
            - field: mem
              label: RAM
              suffix: " MB"
