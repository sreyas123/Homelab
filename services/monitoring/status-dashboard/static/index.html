<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b17">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>__SERVER_NAME__ Live</title>
<style>
:root{
  --fg:#f4f6ff; --muted:rgba(232,236,255,.68); --faint:rgba(232,236,255,.45);
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --accent:#8b9bff;
  --r:26px; --gap:12px;
  --glass-a:rgba(255,255,255,.15); --glass-b:rgba(255,255,255,.04); --edge:rgba(255,255,255,.20);
  --hi:rgba(255,255,255,.42); --shadow:rgba(0,0,0,.32); --chip:rgba(255,255,255,.10);
  --bg-base:#070b17;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{--fg:#0f1530;--muted:rgba(20,26,60,.72);--faint:rgba(20,26,60,.5);--ok:#059669;--warn:#b45309;--bad:#e11d48;--accent:#4f5bd5;
    --glass-a:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.28);--edge:rgba(255,255,255,.85);--hi:rgba(255,255,255,.95);--shadow:rgba(40,50,120,.16);--chip:rgba(255,255,255,.55);--bg-base:#e9edff}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.4 var(--font);background:var(--bg-base);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 50% at 10% 6%,rgba(99,102,241,.60),transparent 62%),
  radial-gradient(52% 46% at 92% 10%,rgba(236,72,153,.42),transparent 62%),
  radial-gradient(58% 56% at 84% 96%,rgba(20,184,166,.48),transparent 62%),
  radial-gradient(46% 46% at 6% 92%,rgba(245,158,11,.30),transparent 62%),
  var(--bg-base)}
@media (prefers-color-scheme:light){.bg{background:
  radial-gradient(60% 50% at 10% 6%,rgba(129,140,248,.55),transparent 62%),
  radial-gradient(52% 46% at 92% 10%,rgba(244,114,182,.40),transparent 62%),
  radial-gradient(58% 56% at 84% 96%,rgba(45,212,191,.45),transparent 62%),
  radial-gradient(46% 46% at 6% 92%,rgba(251,191,36,.35),transparent 62%),var(--bg-base)}}

.glass{position:relative;border-radius:var(--r);
  background:linear-gradient(145deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--edge);
  box-shadow:0 10px 30px var(--shadow),inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 22px rgba(255,255,255,.04)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.20),transparent 48%),linear-gradient(180deg,rgba(255,255,255,.08),transparent 30%)}
.glass>*{position:relative}

.wrap{max-width:1320px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(26px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.08));border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 6px 16px var(--shadow)}
.logo svg{width:24px;height:24px}
h1{margin:0;font-size:clamp(19px,2.6vw,26px);letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.right{display:flex;align-items:center;gap:10px;flex:none}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:right;line-height:1.15}
.clock b{display:block;color:var(--fg);font-size:18px;font-weight:600}
.live{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:var(--chip);border:1px solid var(--edge);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.live.off i{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* overview */
.overview{display:grid;gap:var(--gap);grid-template-columns:1fr}
.hero{padding:20px;display:flex;align-items:center;gap:16px}
.orb{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.85),transparent 38%),linear-gradient(145deg,var(--c1),var(--c2));
  box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 10px 28px var(--glow),0 0 40px var(--glow)}
.orb svg{width:32px;height:32px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.hero.ok{--c1:#34d399;--c2:#0d9488;--glow:rgba(52,211,153,.45)}
.hero.warn{--c1:#fbbf24;--c2:#f97316;--glow:rgba(251,191,36,.45)}
.hero.bad{--c1:#fb7185;--c2:#e11d48;--glow:rgba(251,113,133,.5)}
.hero h2{margin:0;font-size:clamp(20px,3vw,28px);letter-spacing:-.01em;line-height:1.15}
.hero p{margin:4px 0 0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:4px 10px;border-radius:99px;background:var(--chip);border:1px solid var(--edge);font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}

.metrics{display:grid;gap:var(--gap);grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{padding:14px 14px 10px;overflow:hidden}
.tile .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .lab{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tile .val{font-size:clamp(26px,4.4vw,34px);font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:4px}
.tile .val small{font-size:.5em;font-weight:600;color:var(--muted);margin-left:2px}
.tile .cap{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{flex:none;width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.14)}
.ring .fg{stroke:var(--tone);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .4s;filter:drop-shadow(0 0 4px var(--tone))}
.spark{display:block;width:100%;height:30px;margin-top:6px;color:var(--tone)}
.spark path.line{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spark path.area{fill:currentColor;opacity:.16}
.tone-ok{--tone:var(--ok)}.tone-warn{--tone:var(--warn)}.tone-bad{--tone:var(--bad)}

/* alerts */
.alerts{margin-top:var(--gap);padding:14px 16px;border-color:rgba(251,113,133,.55)}
.alerts.warnonly{border-color:rgba(251,191,36,.55)}
.alerts h3{margin:0 0 8px;font-size:15px}
.alerts ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alerts li{display:flex;gap:10px;align-items:center;font-size:14px}
.alerts li i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad)}
.alerts li.warn i{background:var(--warn);box-shadow:0 0 10px var(--warn)}

/* services */
.group{margin-top:22px;min-width:0}
.group h3{margin:0 0 10px 6px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.group h3 span{font-weight:500;color:var(--faint);letter-spacing:0;text-transform:none}
#services{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));column-gap:var(--gap);align-items:start}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(2,minmax(0,1fr))}
.card{display:flex;flex-direction:column;gap:6px;padding:14px;color:inherit;text-decoration:none;min-height:104px;transition:transform .15s ease,box-shadow .15s ease}
a.card:active{transform:scale(.985)}
@media (hover:hover){a.card:hover{transform:translateY(-2px);box-shadow:0 16px 36px var(--shadow),inset 0 1px 0 var(--hi)}}
.card .head{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(0,0,0,.25)}
.card .name{font-weight:650;font-size:15px;line-height:1.15;min-width:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}.dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.card .desc{font-size:12.5px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .stats{min-width:0;overflow:hidden;text-overflow:ellipsis}
.card .meta b{color:var(--fg);font-weight:600}
.card .go{font-weight:700;color:var(--muted)}
.g-Media{--c1:#818cf8;--c2:#6366f1}.g-Home{--c1:#fbbf24;--c2:#f97316}.g-Monitoring{--c1:#34d399;--c2:#0d9488}
.g-Admin{--c1:#a78bfa;--c2:#7c3aed}.g-Background{--c1:#94a3b8;--c2:#64748b}.g-Other{--c1:#f472b6;--c2:#db2777}
.empty{padding:22px;text-align:center;color:var(--muted)}
footer{margin:26px 4px 0;text-align:center;color:var(--faint);font-size:12px}

/* wider screens and landscape */
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (min-width:760px){
  .overview{grid-template-columns:minmax(260px,.85fr) 2.15fr}
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{flex-direction:column;align-items:flex-start;justify-content:center;gap:14px}
}
@media (min-width:1100px){.wrap{padding-top:22px}}
/* phone in landscape: short and wide - compact everything so it fits without endless scrolling */
@media (orientation:landscape) and (max-height:560px){
  :root{--r:20px;--gap:9px}
  .top{padding:2px 2px 9px}
  .logo{width:36px;height:36px;border-radius:12px}.logo svg{width:20px;height:20px}
  .sub{display:none}
  .hero{padding:14px;gap:10px}
  .orb{width:52px;height:52px}.orb svg{width:26px;height:26px}
  .hero h2{font-size:19px}.hero p{font-size:13px}.chips{margin-top:6px}
  .tile{padding:10px 11px 7px}
  .tile .val{font-size:24px}.ring{width:36px;height:36px}.spark{height:22px;margin-top:3px}
  .group{margin-top:14px}.group h3{margin-bottom:7px}
  .card{padding:11px;min-height:86px;gap:4px}
  .avatar{width:28px;height:28px;border-radius:10px;font-size:13px}
  .card .desc{-webkit-line-clamp:1}
  footer{margin-top:16px}
}
@media (max-width:520px){.card{padding:12px;min-height:96px}.avatar{width:30px;height:30px;border-radius:11px;font-size:14px}.card .name{font-size:14px}.card .head{gap:8px}}
@media (max-width:700px),(max-height:560px){.glass{-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(28,34,62,.82)}}
@media (max-width:359px){.hero{padding:14px}.orb{width:54px;height:54px}.tile .val{font-size:24px}.ring{width:38px;height:38px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></div>
      <div><h1>__SERVER_NAME__</h1><p class="sub" id="sub">Live server status</p></div>
    </div>
    <div class="right">
      <div class="clock" id="clock"><b>--:--</b><span></span></div>
      <span class="live" id="live"><i></i><span id="livetxt">Live</span></span>
    </div>
  </header>

  <div class="overview">
    <section class="glass hero ok" id="hero" aria-live="polite">
      <div class="orb" id="orb"></div>
      <div>
        <h2 id="headline">Checking...</h2>
        <p id="subline">&nbsp;</p>
        <div class="chips" id="chips"></div>
      </div>
    </section>
    <section class="metrics" id="metrics"></section>
  </div>

  <section class="glass alerts" id="alerts" hidden></section>
  <div id="services"></div>
  <footer id="foot">Updates every few seconds &middot; read straight from the host</footer>
</main>

<script>
"use strict";
var INIT = /*__INIT__*/null;
var ORDER = ["Media","Home","Monitoring","Admin","Background","Other"];
var svgOk = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var svgWarn = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6M12 17h.01"/></svg>';
var svgBad = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';
var $ = function (id) { return document.getElementById(id); };
var C = 2 * Math.PI * 19; // ring circumference (r = 19)
var hist = INIT ? INIT.history : { cpu: [], mem: [], io: [], disk: [] };
var tiles = {}, cards = {}, fails = 0, timer = null;

function gb(b) { return b >= 1e12 ? (b / 1e12).toFixed(2) + " TB" : (b / 1073741824).toFixed(b >= 1.07e10 ? 0 : 1) + " GB"; }
function mb(b) { return b == null ? "-" : b >= 1073741824 ? (b / 1073741824).toFixed(1) + " GB" : Math.round(b / 1048576) + " MB"; }
function dur(s) {
  var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? d + "d " + h + "h" : h ? h + "h " + m + "m" : m + "m";
}
function tone(v, warn, bad) { return v >= bad ? "bad" : v >= warn ? "warn" : "ok"; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

/* ---------- metric tiles ---------- */
var TILE_DEFS = [
  { id: "cpu", label: "CPU" }, { id: "mem", label: "Memory" }, { id: "disk", label: "Storage" },
  { id: "io", label: "Drive busy" }, { id: "swap", label: "Swap" }, { id: "temp", label: "Temperature" }
];
function buildTiles() {
  var host = $("metrics"); host.innerHTML = "";
  TILE_DEFS.forEach(function (d) {
    var el = document.createElement("div");
    el.className = "glass tile tone-ok";
    el.innerHTML = '<div class="row"><div><div class="lab">' + d.label + '</div><div class="val"><span class="n">-</span><small></small></div></div>' +
      '<svg class="ring" viewBox="0 0 46 46"><circle class="tr" cx="23" cy="23" r="19"/><circle class="fg" cx="23" cy="23" r="19" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/></svg></div>' +
      '<div class="cap">&nbsp;</div><svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><path class="area"/><path class="line"/></svg>';
    host.appendChild(el);
    tiles[d.id] = { el: el, n: el.querySelector(".n"), u: el.querySelector("small"), cap: el.querySelector(".cap"), fg: el.querySelector(".fg"), line: el.querySelector(".line"), area: el.querySelector(".area") };
  });
}
function setTile(id, value, unit, pct, t, cap, series) {
  var x = tiles[id]; if (!x) return;
  x.n.textContent = value; x.u.textContent = unit || ""; x.cap.textContent = cap;
  x.el.className = "glass tile tone-" + t;
  x.fg.style.strokeDashoffset = (C * (1 - Math.max(0, Math.min(100, pct)) / 100)).toFixed(1);
  if (series && series.length > 1) {
    var s = series.slice(-60), max = Math.max.apply(null, s.concat([id === "io" ? 20 : 100])), min = 0, w = 100 / (s.length - 1), d = "";
    s.forEach(function (v, i) { d += (i ? "L" : "M") + (i * w).toFixed(1) + " " + (29 - (v - min) / (max - min || 1) * 27).toFixed(1); });
    x.line.setAttribute("d", d); x.area.setAttribute("d", d + "L100 30L0 30Z");
  }
}

/* ---------- service cards ---------- */
function groupBlock(name) {
  var id = "grp-" + name, g = $(id);
  if (g) return g;
  g = document.createElement("section"); g.className = "group"; g.id = id;
  g.innerHTML = '<h3>' + esc(name) + ' <span></span></h3><div class="grid"></div>';
  var after = null;
  Array.prototype.forEach.call($("services").children, function (c) {
    if (!after && ORDER.indexOf(c.id.slice(4)) > ORDER.indexOf(name)) after = c;
  });
  $("services").insertBefore(g, after);
  return g;
}
function cardFor(c) {
  var x = cards[c.name];
  if (x) return x;
  var g = groupBlock(c.group), a = document.createElement(c.port && c.link !== false ? "a" : "div");
  a.className = "glass card g-" + (ORDER.indexOf(c.group) >= 0 ? c.group : "Other");
  if (a.tagName === "A") { a.href = c.scheme + "://" + location.hostname + ":" + c.port + "/"; a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = '<div class="head"><div class="avatar">' + esc((c.label || c.name).charAt(0).toUpperCase()) + '</div><div class="name">' + esc(c.label) + '</div><i class="dot"></i></div>' +
    '<div class="desc">' + esc(c.desc || c.name) + '</div><div class="meta"><span class="stats"></span><span class="go">' + (a.tagName === "A" ? "↗" : "") + '</span></div>';
  g.querySelector(".grid").appendChild(a);
  x = cards[c.name] = { el: a, dot: a.querySelector(".dot"), stats: a.querySelector(".stats"), group: g };
  return x;
}
function renderCards(list) {
  var seen = {}, counts = {};
  list.forEach(function (c) {
    seen[c.name] = 1; counts[c.group] = (counts[c.group] || 0) + 1;
    var x = cardFor(c);
    var bad = c.state !== "running" || c.health === "unhealthy", warn = c.health === "starting";
    x.dot.className = "dot" + (bad ? " bad" : warn ? " warn" : "");
    x.el.title = c.status;
    x.stats.innerHTML = c.state === "running"
      ? '<b>' + (c.cpu == null ? "-" : c.cpu.toFixed(c.cpu < 10 ? 1 : 0) + "%") + '</b> CPU &middot; <b>' + mb(c.mem) + '</b>'
      : '<b>' + esc(c.state) + '</b>';
  });
  Object.keys(cards).forEach(function (n) {
    if (!seen[n]) { var g = cards[n].group; cards[n].el.remove(); delete cards[n]; if (!g.querySelector(".card")) g.remove(); }
  });
  Object.keys(counts).forEach(function (g) { var s = document.querySelector("#grp-" + g + " h3 span"); if (s) s.textContent = counts[g] + (counts[g] === 1 ? " service" : " services"); });
}

/* ---------- main render ---------- */
function render(s) {
  var h = s.host, ct = s.containers || [];
  if (!h || h.cpu_pct === undefined) return;
  var up = ct.filter(function (c) { return c.state === "running" && c.health !== "unhealthy"; }).length;
  var hero = $("hero"); hero.className = "glass hero " + s.overall;
  $("orb").innerHTML = s.overall === "ok" ? svgOk : s.overall === "warn" ? svgWarn : svgBad;
  $("headline").textContent = s.overall === "ok" ? "All systems normal" : s.overall === "warn" ? "Needs attention" : (s.problems.length > 1 ? s.problems.length + " problems" : "A service has a problem");
  $("subline").textContent = s.overall === "ok" ? up + " of " + ct.length + " services healthy" : s.problems.map(function (p) { return p.text; }).slice(0, 2).join(" · ");
  $("chips").innerHTML = '<span class="chip">Up <b>' + dur(h.uptime_s) + '</b></span><span class="chip">Load <b>' + h.load[0].toFixed(2) + '</b></span>' +
    '<span class="chip">Services <b>' + up + '/' + ct.length + '</b></span>';
  $("sub").textContent = up + " of " + ct.length + " services running";

  setTile("cpu", h.cpu_pct.toFixed(0), "%", h.cpu_pct, tone(h.cpu_pct, 70, 90), "load " + h.load[0].toFixed(2) + " · " + h.cores + " threads", hist.cpu);
  setTile("mem", h.mem_pct.toFixed(0), "%", h.mem_pct, tone(h.mem_pct, 80, 92), gb(h.mem_used) + " of " + gb(h.mem_total), hist.mem);
  setTile("disk", h.disk_pct.toFixed(0), "%", h.disk_pct, tone(h.disk_pct, 85, 95), gb(h.disk_used) + " of " + gb(h.disk_total), hist.disk);
  setTile("io", h.io_some10.toFixed(0), "%", h.io_some10 * 2, tone(h.io_full60, 15, 30), "stalled " + h.io_full60.toFixed(0) + "% of last minute", hist.io);
  setTile("swap", h.swap_pct.toFixed(0), "%", h.swap_pct, tone(h.swap_pct, 50, 80), gb(h.swap_used) + " of " + gb(h.swap_total), null);
  setTile("temp", h.temp_c == null ? "-" : h.temp_c.toFixed(0), "°C", h.temp_c == null ? 0 : (h.temp_c - 30) / 60 * 100, h.temp_c == null ? "ok" : tone(h.temp_c, 75, 90), "processor package", null);

  var al = $("alerts");
  if (s.problems.length) {
    al.hidden = false; al.className = "glass alerts" + (s.overall === "warn" ? " warnonly" : "");
    al.innerHTML = '<h3>' + (s.problems.length === 1 ? "1 open problem" : s.problems.length + " open problems") + '</h3><ul>' +
      s.problems.map(function (p) { return '<li class="' + p.level + '"><i></i>' + esc(p.text) + '</li>'; }).join("") + '</ul>';
  } else { al.hidden = true; }
  renderCards(ct);
  var live = $("live"); live.className = "live"; $("livetxt").textContent = "Live";
  $("foot").textContent = (INIT && INIT.demo ? "Demo data · " : "") + "Updated " + new Date(s.ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " · refreshes every 5 seconds";
}

function tick() {
  var d = new Date();
  $("clock").innerHTML = "<b>" + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + "</b>" + d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}
function poll() {
  if (document.hidden) return;
  var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 4000);
  fetch("/api/status", { cache: "no-store", signal: ctl.signal }).then(function (r) { return r.json(); }).then(function (s) {
    clearTimeout(t); fails = 0;
    ["cpu_pct:cpu", "mem_pct:mem", "io_some10:io", "disk_pct:disk"].forEach(function (p) { var a = p.split(":"); hist[a[1]].push(s.host[a[0]]); hist[a[1]] = hist[a[1]].slice(-120); });
    render(s);
  }).catch(function () {
    clearTimeout(t);
    if (++fails >= 2) { $("live").className = "live off"; $("livetxt").textContent = "Offline"; $("headline").textContent = "Connection lost"; $("subline").textContent = "Trying to reconnect..."; }
  });
}

buildTiles(); tick(); setInterval(tick, 15000);
if (INIT && INIT.state) render(INIT.state);
poll(); timer = setInterval(poll, 5000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
</script>
</body>
</html>
